<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 2: Form Validation</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f5f5f5; }
      form { width: 380px; margin: 40px auto; padding: 24px; background: #fff; border-radius: 8px; }
      label { display: block; margin-top: 12px; font-weight: bold; }
      input { width: 100%; padding: 8px; font-size: 16px; box-sizing: border-box; border: 1px solid #999; border-radius: 4px; }
      button { margin-top: 16px; padding: 10px 24px; font-size: 16px; cursor: pointer; }
      .error { color: #c0392b; font-size: 14px; margin: 4px 0 0; min-height: 18px; }
      .invalid { border: 2px solid #c0392b; }
      #success { color: #2e8b57; font-weight: bold; }
    </style>
  </head>
  <body>
    <!--
      TASK 2: FORM VALIDATION (6 pts)
      Follow the numbered steps in the LAB 8 sheet. Save your finished file as Q2.html.

      STEP 2: The HTML below is already written for you. Do NOT change the ids.
              Notice "novalidate" on the form: the browser will NOT show its own bubbles,
              so your JavaScript messages are the only ones the user sees.
    -->
    <form id="signup" novalidate>
      <h2>Sign up</h2>

      <label for="username">Username</label>
      <input id="username" type="text" aria-describedby="username-err" />
      <p class="error" id="username-err"></p>

      <label for="email">Email</label>
      <input id="email" type="email" required aria-describedby="email-err" />
      <p class="error" id="email-err"></p>

      <label for="pw">Password</label>
      <input id="pw" type="password" aria-describedby="pw-err" />
      <p class="error" id="pw-err"></p>

      <button type="submit">Sign up</button>
      <p id="success"></p>
    </form>

    <script>
      // STEP 3: Select the form, the 3 inputs and the success paragraph with document.getElementById().
      //         Names: form, username, email, pw, success
      const form = document.getElementById("signup");
      const username = document.getElementById("username");
      const email = document.getElementById("email");
      const pw = document.getElementById("pw");
      const success = document.getElementById("success");

      // STEP 4: These two helper functions are given to you. Read them and explain them to your TA.
      function showError(input, msg) {
        document.getElementById(input.id + "-err").textContent = msg;
        input.classList.add("invalid");
        input.setAttribute("aria-invalid", "true");
      }
      function clearError(input) {
        document.getElementById(input.id + "-err").textContent = "";
        input.classList.remove("invalid");
        input.removeAttribute("aria-invalid");
      }


      // STEP 5: Listen for "submit" on the form. First line inside: event.preventDefault()     (1 pt)
      //         Then use a variable let ok = true; and check EVERY field (do not stop at the first error):
      form.addEventListener("submit", (event) => {
          event.preventDefault();

          let ok = true;
          const userValue = username.value.trim();
      // STEP 6: The rules (use showError / clearError for each field):                          (4 pts)
      //         a) username: required, 3-15 characters (use .value.trim().length)
      //            messages: "Please enter a username" / "Username must be 3-15 characters"
              if (userValue.length === 0) {
          showError(username, "Please enter a username");
          ok = false;
        } else if (userValue.length < 3 || userValue.length > 15) {
          showError(username, "Username must be 3-15 characters");
          ok = false;
        } else {
          clearError(username);
        }
      
      
      //         b) email: must be valid. Use email.validity.valid
      //            message: "Enter a valid email, e.g. name@cmu.ac.th"
      
              if (!email.validity.valid) {
          showError(email, "Enter a valid email, e.g. name@cmu.ac.th");
          ok = false;
        } else {
          clearError(email);
        }
      
      
      
      //         c) password: at least 8 characters AND at least one number. Hint: /[0-9]/.test(pw.value)
      //            messages: "Password needs at least 8 characters" / "Password needs at least one number"

              if (pw.value.length < 8) {
          showError(pw, "Password needs at least 8 characters");
          ok = false;
        } else if (!/[0-9]/.test(pw.value)) {
          showError(pw, "Password needs at least one number");
          ok = false;
        } else {
          clearError(pw);
        }
      
      // STEP 7: If ok is still true: success.textContent = "Welcome, <username>!" and form.reset()   (1 pt)
      //         If not ok: success.textContent = ""
        if (ok) {
          success.textContent = `Welcome, ${userValue}!`;
          form.reset();
        } else {
          success.textContent = "";
        }
      });

      // STEP 8: Test with the table in the LAB 8 sheet.

      // STEP 9 (CHALLENGE, no points): after the first submit, re-check a field while the user types
      //         (listen for "input" on each field).
    </script>
  </body>
</html>
